name: Database

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: database-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Database setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      POSTGRES_DB: bicycle_rental_ci
      POSTGRES_USER: bicycle_rental_ci
      POSTGRES_PASSWORD: disposable_ci_password
      POSTGRES_PORT: "5432"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Protect merged migrations
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: ./.github/scripts/check-migration-history.ps1 -BaselineCommit $env:BASE_COMMIT

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start PostgreSQL
        run: docker compose up -d --wait --wait-timeout 120 db

      - name: Apply migrations
        run: docker compose run --rm flyway migrate

      - name: Validate migrations
        run: docker compose run --rm flyway validate

      - name: Verify migration rerun
        run: docker compose run --rm flyway migrate

      - name: Show migration status
        run: docker compose run --rm flyway info

      - name: Check database setup
        run: |
          docker compose exec -T db psql \
            --username "$POSTGRES_USER" \
            --dbname "$POSTGRES_DB" \
            --set=ON_ERROR_STOP=1 < db/checks/setup.sql

      - name: Test fleet and station constraints
        run: |
          docker compose exec -T db psql \
            --username "$POSTGRES_USER" \
            --dbname "$POSTGRES_DB" \
            --set=ON_ERROR_STOP=1 < db/tests/fleet_station.sql

      - name: Show database logs on failure
        if: failure()
        run: docker compose logs --no-color db

      - name: Remove CI containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
