name: Database

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: database-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Database setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      POSTGRES_DB: bicycle_rental_ci
      POSTGRES_USER: bicycle_rental_ci
      POSTGRES_PASSWORD: disposable_ci_password
      POSTGRES_PORT: "5432"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Protect merged migrations
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: ./.github/scripts/check-migration-history.ps1 -BaselineCommit $env:BASE_COMMIT

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start PostgreSQL
        run: docker compose up -d --wait --wait-timeout 120 db

      - name: Apply migrations
        run: docker compose run --rm flyway migrate

      - name: Validate migrations
        run: docker compose run --rm flyway validate

      - name: Verify migration rerun
        run: docker compose run --rm flyway migrate

      - name: Show migration status
        run: docker compose run --rm flyway info

      - name: Check database setup
        run: |
          docker compose exec -T db psql \
            --username "$POSTGRES_USER" \
            --dbname "$POSTGRES_DB" \
            --set=ON_ERROR_STOP=1 < db/checks/setup.sql

      - name: Test account system
        run: |
          docker compose exec -T db psql \
            --username "$POSTGRES_USER" \
            --dbname "$POSTGRES_DB" \
            --set=ON_ERROR_STOP=1 < db/tests/account_system.sql

      - name: Test fleet and station constraints
        run: |
          docker compose exec -T db psql \
            --username "$POSTGRES_USER" \
            --dbname "$POSTGRES_DB" \
            --set=ON_ERROR_STOP=1 < db/tests/fleet_station.sql

      - name: Test setup guards in a fresh connection
        run: |
          docker compose exec -T db psql \
            --username "$POSTGRES_USER" \
            --dbname "$POSTGRES_DB" \
            --set=ON_ERROR_STOP=1 < db/tests/setup_guards.sql

      - name: Test rental lifecycle
        run: |
          docker compose exec -T db psql \
            --username "$POSTGRES_USER" \
            --dbname "$POSTGRES_DB" \
            --set=ON_ERROR_STOP=1 < db/tests/rental_lifecycle.sql

      - name: Test competing rental requests
        run: |
          PSQL_CMD="docker compose exec -T db psql --username $POSTGRES_USER --dbname $POSTGRES_DB" \
            bash db/tests/rental_concurrency.sh

      - name: Test payment processing
        run: |
          docker compose exec -T db psql \
            --username "$POSTGRES_USER" \
            --dbname "$POSTGRES_DB" \
            --set=ON_ERROR_STOP=1 < db/tests/payment_processing_tests.sql

      - name: Test committed payment recovery
        run: |
          docker compose exec -T db psql \
            --username "$POSTGRES_USER" \
            --dbname "$POSTGRES_DB" \
            --set=ON_ERROR_STOP=1 < db/tests/payment_recovery_tests.sql

      - name: Test concurrent payment requests and submissions
        run: |
          docker compose exec -T db sh -c \
            'export PGUSER="$POSTGRES_USER" PGDATABASE="$POSTGRES_DB"; exec bash' \
            < db/tests/payment_concurrency_test.sh

      - name: Test fault reports and maintenance management
        run: |
          docker compose exec -T db psql \
            --username "$POSTGRES_USER" \
            --dbname "$POSTGRES_DB" \
            --set=ON_ERROR_STOP=1 < db/tests/fault_and_maintenance.sql

      - name: Test bicycle movements and history
        run: |
          docker compose exec -T db psql \
            --username "$POSTGRES_USER" \
            --dbname "$POSTGRES_DB" \
            --set=ON_ERROR_STOP=1 < db/tests/bicycle_movement.sql

      - name: Test competing bicycle movements
        run: |
          PSQL_CMD="docker compose exec -T db psql --username $POSTGRES_USER --dbname $POSTGRES_DB" \
            bash db/tests/bicycle_movement_concurrency.sh

      - name: Test audit integration
        run: |
          docker compose exec -T db psql \
            --username "$POSTGRES_USER" \
            --dbname "$POSTGRES_DB" \
            --set=ON_ERROR_STOP=1 < db/tests/audit_integration.sql

      - name: Test competing maintenance job creation
        run: |
          PSQL_CMD="docker compose exec -T db psql --username $POSTGRES_USER --dbname $POSTGRES_DB" \
            bash db/tests/maintenance_job_concurrency.sh

      - name: Test role access control
        run: |
          docker compose exec -T db psql \
            --username "$POSTGRES_USER" \
            --dbname "$POSTGRES_DB" \
            --set=ON_ERROR_STOP=1 < db/tests/access_control.sql

      - name: Show database logs on failure
        if: failure()
        run: docker compose logs --no-color db

      - name: Remove CI containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans